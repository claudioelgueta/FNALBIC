<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNAF Simple - Texturas editables</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#ddd;font-family:Arial;overflow:hidden}
#game{height:100vh;position:relative;overflow:hidden;background:#050505 url("assets/oficina_apagada.png") center/cover no-repeat;background-position:50% 50%;transition:background-position .12s ease}
#hud{position:absolute;z-index:50;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;font-size:18px;text-shadow:0 2px 4px #000}
#window{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:54%;height:58%;background:#000 url("assets/ventana.png") center/cover;border:18px solid #151515;box-shadow:inset 0 0 50px #000,0 0 30px #000;overflow:hidden}
#windowLight{position:absolute;inset:0;background:url("assets/luz_ventana.png") center/cover no-repeat;opacity:0;transition:.15s;z-index:2}
#monster{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:180px;height:300px;opacity:0;transition:.2s;z-index:3}#monster img{width:100%;height:100%;object-fit:contain}
#doorArea{position:absolute;right:0;top:0;height:100%;width:22%;overflow:hidden;border-left:8px solid #191919;background:url("assets/puerta.png") center/cover}
#door{position:absolute;inset:0;background:url("assets/puerta.png") center/cover;transition:.35s}#door.open{transform:translateX(100%)}
#doorLight{position:absolute;inset:0;background:url("assets/puerta_cerca_encendida.png") center/cover no-repeat;opacity:0;pointer-events:none;transition:.12s;z-index:4}
#rightDoorView{position:absolute;inset:0;background:#000 url("assets/pasillo_largo.png") center/cover no-repeat;display:none;z-index:45}#doorViewLight{position:absolute;inset:0;background:url("assets/pasillo_luz.png") center/cover no-repeat;opacity:0;transition:.12s;pointer-events:none;z-index:2}
#doorTransition{position:absolute;inset:0;background:#000 url("assets/puerta_cerca.png") center/cover no-repeat;z-index:40;display:none;animation:walk .85s ease-in-out forwards}
@keyframes walk{0%{opacity:1;transform:scale(1)}55%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1.2)}}
#doorViewControls{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:none;gap:10px;z-index:60}
#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:30;flex-wrap:wrap;justify-content:center}
#keyConfig{position:absolute;right:15px;bottom:20px;z-index:70;background:rgba(10,10,10,.94);border:2px solid #555;border-radius:8px;padding:14px;display:none;width:min(360px,90vw);box-shadow:0 8px 30px #000}
#keyConfig h3{margin:0 0 10px;font-size:18px}#keyConfig p{margin:0 0 10px;font-size:13px;color:#aaa}
.keyRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}.keyRow span{font-size:14px}
.keyBind{min-width:90px;padding:8px 10px}
button{background:#1c1c1c;color:#eee;border:2px solid #555;padding:13px 18px;border-radius:6px;font-weight:bold;cursor:pointer}button:hover{background:#333}

#blackout{position:absolute;inset:0;background:#000;opacity:.55;pointer-events:none;z-index:20;transition:.1s}
#message,#jumpscare{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;text-align:center}#message{font-size:30px;background:rgba(0,0,0,.7)}#jumpscare{background:#000}#jumpscare img{width:min(55vw,420px);max-height:75vh;object-fit:contain}
</style></head><body><div id="game">
<div id="hud"><div id="time">12 AM</div><div id="power">Energía: 100%</div></div>
<div id="window"><div id="windowLight"></div><div id="monster"><img src="assets/animatronic.png"></div></div>
<div id="doorArea"><div id="door"></div><div id="doorLight"></div></div>
<div id="rightDoorView"><div id="doorViewLight"></div></div><div id="doorTransition"></div>
<div id="doorViewControls"><button id="doorLampAtDoor">Encender luz</button><button id="back">Volver</button><button id="closeDoor">Cerrar puerta</button></div>
<div id="keyConfig">
<h3>⌨️ Controles de teclado</h3><p>Haz clic en una tecla y luego presiona la tecla que quieras usar.</p>
<div class="keyRow"><span>Ir a la puerta / volver</span><button class="keyBind" data-action="door">E</button></div>
<div class="keyRow"><span>Luz de puerta</span><button class="keyBind" data-action="doorLight">L</button></div>
<div class="keyRow"><span>Luz de oficina</span><button class="keyBind" data-action="officeLight">O</button></div>
<div class="keyRow"><span>Luz de ventana</span><button class="keyBind" data-action="windowLight">V</button></div>
<div class="keyRow"><span>Cerrar / abrir puerta</span><button class="keyBind" data-action="closeDoor">C</button></div>
<button id="closeKeyConfig" style="width:100%;margin-top:8px">Cerrar configuración</button>
</div>
<div id="blackout"></div><div id="message"></div><div id="jumpscare"><img src="assets/animatronic.png"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let power=100,hour=0,sec=0,playing=true,atDoor=false,closed=false,doorLight=false,officeLight=false,windowLight=false,monsterPos=0,transitioning=false;
const defaultKeys={door:"e",doorLight:"l",officeLight:"o",windowLight:"v",closeDoor:"c"};
let keys={...defaultKeys},waitingAction=null;
try{keys={...defaultKeys,...JSON.parse(localStorage.getItem("fnafKeys")||"{}")}}catch(e){}
const keyNames={door:"Ir a la puerta / volver",doorLight:"Luz de puerta",officeLight:"Luz de oficina",windowLight:"Luz de ventana",closeDoor:"Cerrar / abrir puerta"};
function saveKeys(){localStorage.setItem("fnafKeys",JSON.stringify(keys));updateKeyButtons()}
function keyLabel(k){if(k===" ")return "ESPACIO";return k.length===1?k.toUpperCase():k.replace(/^Arrow/,"").toUpperCase()}
function updateKeyButtons(){document.querySelectorAll(".keyBind").forEach(b=>b.textContent=keyLabel(keys[b.dataset.action]))}
function runAction(action){
 if(!playing)return;
 if(action==="door"){if(atDoor){$("back").click()}else{enterDoor()}}
 else if(action==="doorLight"){if(atDoor)$("doorLampAtDoor").click();else $("doorLamp").click()}
 else if(action==="officeLight")$("officeLamp").click();
 else if(action==="windowLight")$("windowLamp").click();
 else if(action==="closeDoor"&&atDoor)$("closeDoor").click();
}
function update(){
 $("time").textContent=(hour===0?"12":hour)+" AM";$("power").textContent="Energía: "+Math.max(0,Math.floor(power))+"%";
 $("door").style.display=atDoor?"none":"block";$("door").classList.toggle("open",!closed);
 $("doorArea").style.backgroundImage=`url("assets/${closed?"puerta_cerca_cerrada":doorLight?"puerta_cerca_encendida":"puerta_cerca"}.png")`;
 $("rightDoorView").style.backgroundImage=`url("assets/${closed?"puerta_cerca_cerrada":"pasillo_largo"}.png")`;
 $("windowLight").style.opacity=windowLight?"1":"0";$("doorViewLight").style.opacity=(atDoor&&doorLight&&!closed)?"1":"0";$("blackout").style.opacity=officeLight?"0":"0.55";
 $("game").style.backgroundImage=`url("assets/${officeLight?"oficina_luz":"oficina_apagada"}.png")`;
 
 $("monster").style.opacity=(windowLight&&monsterPos>=3)||officeLight&&monsterPos>=3?"1":"0";
 $("doorLamp").textContent=doorLight?"Apagar luz de puerta":"Encender luz de puerta";
 $("doorLampAtDoor").textContent=doorLight?"Apagar luz":"Encender luz";
 $("officeLamp").textContent=officeLight?"Apagar luz oficina":"Encender luz oficina";
 $("windowLamp").textContent=windowLight?"Apagar luz de ventana":"Luz de ventana";
 $("closeDoor").textContent=closed?"Abrir puerta":"Cerrar puerta";
 if(power<=0){playing=false;end("Se acabó la energía.");}
}
function end(t){$("message").textContent=t;$("message").style.display="flex";$("doorViewControls").style.display="none";}
function scare(){if(!playing)return;playing=false;$("jumpscare").style.display="flex";setTimeout(()=>end("Te atraparon. Recarga la página para jugar otra vez."),900)}
function enterDoor(){
 if(!playing||atDoor||transitioning)return;transitioning=true;$("controls").style.display="none";$("doorTransition").style.display="block";
 setTimeout(()=>{$("doorTransition").style.display="none";$("rightDoorView").style.display="block";$("doorViewControls").style.display="flex";atDoor=true;transitioning=false;update();
   if(monsterPos>=3&&!closed&&!doorLight)setTimeout(scare,700);
 },850);
}
$("doorArea").addEventListener("dblclick",()=>{if(!atDoor&&!transitioning)enterDoor()});
$("back").onclick=()=>{if(!playing)return;atDoor=false;$("rightDoorView").style.display="none";$("doorViewControls").style.display="none";update()};
function toggleDoorLight(){doorLight=!doorLight;power-=.6;if(doorLight&&monsterPos>=2)monsterPos=1;update()}
$("doorLampAtDoor").onclick=toggleDoorLight;
$("closeDoor").onclick=()=>{closed=!closed;if(closed&&monsterPos>=2)monsterPos=1;power-=1.5;update()};


document.querySelectorAll(".keyBind").forEach(b=>b.onclick=()=>{waitingAction=b.dataset.action;b.textContent="PRESIONA..."});
document.addEventListener("mousemove",e=>{
 if(atDoor||transitioning||!playing)return;
 const ratio=Math.max(0,Math.min(1,e.clientX/innerWidth));
 const pos=20+(ratio*60);
 $("game").style.backgroundPosition=pos+"% 50%";
});
document.addEventListener("keydown",e=>{
 if(waitingAction){
   e.preventDefault();e.stopPropagation();
   if(e.key==="Escape"){waitingAction=null;updateKeyButtons();return}
   const k=e.key.toLowerCase();
   if(k==="tab"||k==="enter")return;
   const used=Object.keys(keys).find(a=>keys[a]===k&&a!==waitingAction);
   if(used)keys[used]=keys[waitingAction];
   keys[waitingAction]=k;waitingAction=null;saveKeys();return;
 }
 if(e.repeat)return;
 if(e.key==="Shift"){
   toggleDoorLight();
   e.preventDefault();
   return;
 }
 const k=e.key.toLowerCase();
 const action=Object.keys(keys).find(a=>keys[a]===k);
 if(action){e.preventDefault();runAction(action)}
});
updateKeyButtons();
setInterval(()=>{if(!playing)return;sec++;power-=.07;
if(sec%25===0){hour++;if(hour>=6){playing=false;end("¡6 AM! Sobreviviste la noche.");return}}
if(sec%8===0){let chance=officeLight||doorLight||windowLight?.18:.10;if(Math.random()<chance&&monsterPos<3)monsterPos++;if(monsterPos===3&&!officeLight&&!windowLight&&Math.random()<.5)monsterPos=2}
if(monsterPos>=2&&atDoor&&!closed&&!doorLight)scare();update()},1000);update();
</script></body></html>
